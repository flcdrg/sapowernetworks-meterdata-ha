name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  pytest:
    name: "Pytest (${{ matrix.profile }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
          - profile: min-ha
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true

      - name: Run tests (default dependency set)
        if: matrix.profile == 'default'
        run: uv run pytest

      - name: Run tests (minimum supported Home Assistant)
        if: matrix.profile == 'min-ha'
        run: |
          HA_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('hacs.json').read_text())['homeassistant'])
          PY
          )"
          uv run --with "homeassistant==${HA_VERSION}" pytest
